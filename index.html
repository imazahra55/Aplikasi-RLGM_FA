<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Development Model Reflective Learning Based on Growth Mindset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --navy:#16244a;--navy2:#20335f;--navy3:#2c437a;--blue:#3f68d6;--soft:#e7eefc;--soft2:#f2f6fe;
  --purple:#7556cf;--purple-s:#efeafc;--teal:#13917f;--teal-s:#e2f4f1;--cream:#fbf8f1;--white:#fff;
  --amber:#c9861c;--amber-s:#fbf1df;--red:#c2453f;--red-s:#fbe9e8;--ink:#1d2433;--ink2:#4a5468;--ink3:#7b8497;
  --line:#e3e6ee;--r:14px;--sh:0 1px 2px rgba(22,36,74,.06),0 4px 16px rgba(22,36,74,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5}
a{color:var(--blue)}
h1,h2,h3,h4{margin:0 0 .4em;color:var(--navy);line-height:1.25}
h1{font-size:22px;font-weight:800}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:700}h4{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3)}
.serif{font-family:"Source Serif 4",Georgia,serif}
#app{display:flex;min-height:100vh}
/* sidebar */
#side{width:268px;flex:0 0 268px;background:var(--navy);color:#cfd8ef;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;z-index:40}
#side .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#side .brand .t{color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.02em;line-height:1.35}
#side .brand .s{font-size:10.5px;color:#9fb0d8;margin-top:4px}
#side .grp{padding:12px 10px 2px}
#side .grp>div{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7f91bd;padding:0 10px 6px;font-weight:700}
#side a.mi{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:9px;color:#cfd8ef;text-decoration:none;font-size:13px;cursor:pointer}
#side a.mi:hover{background:rgba(255,255,255,.06);color:#fff}
#side a.mi.on{background:linear-gradient(90deg,rgba(117,86,207,.55),rgba(63,104,214,.35));color:#fff;font-weight:600}
#side a.mi svg{flex:0 0 16px;opacity:.85}
#main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;background:rgba(251,248,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 22px;flex-wrap:wrap}
#top .grow{flex:1}
#menuBtn{display:none}
#main{padding:22px;max-width:1400px;width:100%}
/* components */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card>.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card>.hd h2,.card>.hd h3{margin:0;flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .l{font-size:11.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:26px;font-weight:800;color:var(--navy);margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink2)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--blue))}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph .grow{flex:1;min-width:240px}
.ph p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.crumb{font-size:11.5px;color:var(--purple);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.btn{appearance:none;border:1px solid var(--line);background:var(--white);color:var(--navy);border-radius:9px;padding:7px 12px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}.btn.p:hover{background:var(--navy3)}
.btn.t{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pu{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.d{color:var(--red)}.btn.d:hover{border-color:var(--red)}
.btn.sm{padding:4px 8px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--soft);color:var(--navy2);white-space:nowrap}
.b-ok{background:var(--teal-s);color:#0c6c5e}.b-warn{background:var(--amber-s);color:#8a5a0c}.b-bad{background:var(--red-s);color:#9a2f2a}.b-pu{background:var(--purple-s);color:#5a3fb0}.b-mut{background:#eef0f4;color:var(--ink3)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.t th{position:sticky;top:0;background:var(--soft2);color:var(--navy2);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:7px 10px;border-bottom:1px solid #eef0f5;vertical-align:top}
table.t tr:hover td{background:#fafbff}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #d5dae5;border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
textarea.inp{min-height:70px;resize:vertical}
.inp:focus{outline:2px solid rgba(63,104,214,.25);border-color:var(--blue)}
.inp.sm{padding:4px 7px;font-size:12px;width:auto}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px}
label.f>small{display:block;color:var(--ink3);font-size:11px;margin-top:2px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.fg .full{grid-column:1/-1}
.chk{display:flex;flex-wrap:wrap;gap:4px 12px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:8px}
.chk label{display:flex;gap:5px;align-items:center;font-size:12.5px}
.muted{color:var(--ink3)}.small{font-size:12px}
.note{background:var(--soft2);border:1px solid #d9e3fa;border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.note.w{background:var(--amber-s);border-color:#f0dbb4;border-left-color:var(--amber)}
.note.pu{background:var(--purple-s);border-color:#ddd3f7;border-left-color:var(--purple)}
.note.ok{background:var(--teal-s);border-color:#bfe5de;border-left-color:var(--teal)}
.bar{height:8px;background:#e9ecf3;border-radius:99px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:99px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--purple);border-color:var(--purple)}
.chart{width:100%;height:auto;display:block;max-height:340px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tm{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;box-shadow:var(--sh)}
.tm:hover{border-color:var(--purple)}
.tm .no{font-weight:800;color:var(--purple);font-size:12px}
.stage{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;margin-bottom:10px;border-left:5px solid var(--purple)}
.book{display:grid;grid-template-columns:240px 1fr;gap:16px}
.book nav a{display:block;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink2)}
.book nav a.on{background:var(--purple-s);color:var(--purple);font-weight:700}
.book .content{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 28px;min-height:300px;font-family:"Source Serif 4",Georgia,serif;font-size:15.5px;line-height:1.7}
.book .content[contenteditable=true]{outline:2px dashed var(--purple)}
.matrix td.c{min-width:34px}
.st{display:inline-block;width:22px;height:22px;border-radius:6px;line-height:22px;text-align:center;font-size:11px;font-weight:800}
.st.y{background:var(--teal-s);color:#0c6c5e}.st.n{background:var(--red-s);color:#9a2f2a}.st.x{background:#f1f2f5;color:#aab}
.att button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 7px;font:700 11px inherit;font-family:inherit;cursor:pointer;margin:1px}
.att button.on.H{background:var(--teal);color:#fff;border-color:var(--teal)}.att button.on.T{background:var(--amber);color:#fff;border-color:var(--amber)}
.att button.on.I{background:var(--blue);color:#fff;border-color:var(--blue)}.att button.on.S{background:var(--purple);color:#fff;border-color:var(--purple)}.att button.on.A{background:var(--red);color:#fff;border-color:var(--red)}
.phase{border-radius:14px;padding:16px;color:#fff;margin-bottom:0}
.phase ul{margin:8px 0 0;padding-left:18px}.phase li{margin:3px 0}
.phase a{color:#fff}
#modalBg{position:fixed;inset:0;background:rgba(14,22,45,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:30px 12px}
#modal{background:#fff;border-radius:16px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal.wide{width:min(1100px,100%)}
#modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
#modal .mh h3{flex:1;margin:0}
#modal .mb{padding:16px 18px;max-height:70vh;overflow:auto}
#modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:6px}
#toast div{background:var(--navy);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:var(--sh)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 10% 0%,#2c437a 0%,var(--navy) 55%,#0f1a37 100%);padding:20px}
.login .box{background:#fff;border-radius:20px;max-width:880px;width:100%;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.rolecards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.rolecard{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.rolecard.on{border-color:var(--purple);background:var(--purple-s)}
.rolecard b{display:block;color:var(--navy)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600}
.demo{background:var(--amber-s);color:#8a5a0c;border-color:#f0dbb4}
.ans{white-space:pre-wrap;background:var(--soft2);border-radius:8px;padding:8px 10px;font-size:13px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.q img{max-width:100%;max-height:240px;border-radius:8px;margin:6px 0}
.timer{font-size:20px;font-weight:800;color:var(--purple)}
#printArea{display:none}
@media print{
  body{background:#fff}
  #app,#modalBg,#toast,.login{display:none!important}
  #printArea{display:block!important;padding:0;font-size:11.5px}
  #printArea table{border-collapse:collapse;width:100%}#printArea th,#printArea td{border:1px solid #999;padding:4px 6px}
  #printArea .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  #printArea .tw{max-height:none;overflow:visible}
}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  #side{position:fixed;left:-280px;transition:left .2s}#side.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  #menuBtn{display:inline-flex}#main{padding:14px}
  .g2,.g3,.g4,.fg{grid-template-columns:1fr}.book{grid-template-columns:1fr}
  .rolecards{grid-template-columns:repeat(2,1fr)}
}
</style>

<body>
<div id="root"></div>
<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
/* =================== KONFIGURASI ===================
   Tempel URL Web App Google Apps Script (berakhiran /exec) di bawah ini
   agar semua perangkat otomatis tersambung ke database Google Sheets.
   Biarkan kosong ('') untuk mode lokal.                                  */
window.RLGM_CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxbb5tzJ-rLhR1LwvogOeRrQRcUarCTTW39vOh3OUaM55gtzGiVEbptTzas4opkkbz6/exec'
};
</script>
<script>
'use strict';
/* =========================================================
   DEVELOPMENT MODEL REFLECTIVE LEARNING BASED ON GROWTH MINDSET
   Core: data store, audit trail, revisions, UI helpers, charts, statistics, export
   ========================================================= */
const APP={name:'DEVELOPMENT MODEL REFLECTIVE LEARNING BASED ON GROWTH MINDSET',sub:'Digital Learning, Reflection, Assessment, and Research Management Platform',ver:'1.0.0'};
const COLS=['users','courses','classes','students','meetings','stages','pck','questions','packages','attempts','lkm','lkmAns','gmItems','gmResp',
 'obsInst','obsRec','reflections','pckScores','mtSessions','attendance','meetingReports','qcodes','valInst','validators','valRatings','versions',
 'pracInst','pracResp','irrSets','forum','announcements','peerFeedback','groupTasks','practiceDocs','lkmComments','cpl','cpmk','subcpmk','docs',
 'bookChapters','readMarks','notifications','consentLog','backups'];
/* Data penelitian mentah: perubahan wajib beralasan & tersimpan di riwayat revisi */
const RAW=new Set(['attempts','lkmAns','gmResp','obsRec','reflections','pckScores','mtSessions','attendance','valRatings','pracResp','irrSets','qcodes']);
let DB=null;
const S={uid:null,role:null,sid:null,classId:null,page:'dashboard',p:{}};
const now=()=>new Date().toISOString();
const uid=(p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtD=s=>{if(!s)return '-';const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})};
const fmtDT=s=>{if(!s)return '-';const d=new Date(s);return isNaN(d)?s:d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const n2=(x,d=2)=>(x==null||isNaN(x))?'-':Number(x).toFixed(d);
const pct=(x,d=1)=>(x==null||isNaN(x))?'-':Number(x).toFixed(d)+'%';
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const mean=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?sum(a)/a.length:null};
const uniq=a=>[...new Set(a)];
const by=(k)=>(a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0);

/* ---------------- DEFAULT SETTINGS ---------------- */
function defaultSettings(){return{
  minAttendance:75,selfAttendance:false,
  gm:{scale:5,labels:['Sangat Tidak Setuju','Tidak Setuju','Ragu-ragu','Setuju','Sangat Setuju'],
      categories:[{min:0,max:2.49,label:'Kecenderungan fixed mindset'},{min:2.5,max:3.49,label:'Campuran (mixed)'},{min:3.5,max:5,label:'Kecenderungan growth mindset'}],
      catApproved:false,catBasis:'',open:{awal:false,akhir:false}},
  val:{min:1,max:4,icviCut:3,aikenCrit:0.8,icviCrit:0.78,scviCrit:0.9,methods:{aiken:true,icvi:true,scvi:true}},
  prac:{scale:4,criteria:[{min:81,label:'Sangat praktis'},{min:61,label:'Praktis'},{min:41,label:'Cukup praktis'},{min:0,label:'Kurang praktis'}],approved:false},
  reflInd:['Apa yang telah saya lakukan?','Apa yang saya pikirkan?','Kesulitan apa yang saya alami?','Apa yang saya pelajari?','Bagaimana saya memahami kesulitan siswa?','Apa yang akan saya perbaiki?','Bagaimana strategi saya selanjutnya?'],
  reflGrp:['Apa yang berhasil?','Apa yang belum berhasil?','Apa perbedaan pendapat yang muncul?','Bagaimana kelompok menyelesaikan masalah?','Bagaimana strategi pembelajaran akan diperbaiki?'],
  mtRubric:['Membuka pembelajaran & apersepsi','Penguasaan konsep numerasi','Penggunaan representasi/media','Merespons kesulitan & miskonsepsi siswa','Pemberian umpan balik berorientasi growth mindset','Menutup pembelajaran & refleksi'],
  mtScale:4,groupSize:5,
  consentText:'Saya bersedia data pembelajaran saya (tes, angket, LKM, refleksi, observasi, microteaching) digunakan untuk keperluan penelitian disertasi dengan identitas yang dianonimkan. Saya dapat menarik persetujuan sewaktu-waktu tanpa memengaruhi nilai akademik.',
  prelimNotes:'',plompDecision:{valid:'',praktis:'',efektif:''},
  reg:{open:true,approval:false},access:{},autoBackup:true
}}
function blankDB(){const d={meta:{created:now(),schema:1,demo:false,app:APP.ver},settings:defaultSettings(),audit:[],revisions:[]};COLS.forEach(c=>d[c]=[]);return d}

/* ---------------- STORAGE (IndexedDB + fallback + optional server sync) ---------------- */
const IDB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('rlgm_research',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
 get(k){return new Promise(res=>{try{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null)}catch(e){res(null)}})},
 put(k,v){return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
};
let saveTimer=null,lastSaved=null,syncState='lokal',bkDirty=false;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,250)}
async function flush(){
  const bk=DB.backups;DB.backups=[];const s=JSON.stringify(DB);DB.backups=bk;let ok=false;
  if(IDB.db){ok=await IDB.put('db',s);if(bkDirty){await IDB.put('backups',JSON.stringify(bk));bkDirty=false}}
  if(!ok){try{localStorage.setItem('rlgm_db',s);ok=true}catch(e){}}
  lastSaved=new Date();
  if(typeof scheduleSync==='function')scheduleSync();persistSync&&persistSync();
  const el=document.getElementById('saveInfo');if(el)el.innerHTML=saveInfo();
}
async function loadDB(){
  await IDB.open();let s=null;
  if(IDB.db)s=await IDB.get('db');
  if(!s){try{s=localStorage.getItem('rlgm_db')}catch(e){}}
  if(s){try{DB=JSON.parse(s)}catch(e){DB=null}}
  if(!DB){DB=blankDB();if(!(typeof serverMode==='function'&&serverMode()))seedDemo();}
  if(IDB.db){const b=await IDB.get('backups');if(b){try{DB.backups=JSON.parse(b)}catch(e){}}}
  COLS.forEach(c=>{if(!DB[c])DB[c]=[]});
  DB.settings=Object.assign(defaultSettings(),DB.settings||{});
}
function saveInfo(){const sv=typeof serverMode==='function'&&serverMode();return `<span class="pill" title="Penyimpanan">${icon('db',13)} ${sv?'Google Sheets · '+esc(SY.status||'siap'):(lastSaved?'Tersimpan lokal '+lastSaved.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'Mode lokal')}</span>${sv&&SY.pendingRender?`<a class="pill demo" style="cursor:pointer" onclick="SY.pendingRender=false;render()">Data baru — muat ulang tampilan</a>`:''}`}

/* ---------------- PASSWORD HASH (SHA-256 + salt; sama dengan server Apps Script) ---------------- */
function sha256(str){const ascii=unescape(encodeURIComponent(str));const rr=(v,a)=>(v>>>a)|(v<<(32-a));const mp=Math.pow,mw=mp(2,32);let res='',i,j;const words=[],bl=ascii.length*8;const hash=[],k=[];let pc=0;const comp={};
 for(let c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
 let a2=ascii+'\x80';while(a2.length%64-56)a2+='\x00';for(i=0;i<a2.length;i++){j=a2.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((bl/mw)|0);words[words.length]=bl;
 let H8=hash.slice(0,8);for(j=0;j<words.length;){const w=words.slice(j,j+=16);const old=H8;H8=H8.slice(0,8);for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=H8[0],e=H8[4];
  const t1=H8[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&H8[5])^((~e)&H8[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
  const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&H8[1])^(a&H8[2])^(H8[1]&H8[2]));H8=[(t1+t2)|0].concat(H8);H8[4]=(H8[4]+t1)|0}for(i=0;i<8;i++)H8[i]=(H8[i]+old[i])|0}
 for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(H8[i]>>(j*8))&255;res+=((b<16)?'0':'')+b.toString(16)}return res}
function hashPw(salt,pw){return sha256(salt+':'+pw)}
function pwFields(pw){const salt=Math.random().toString(16).slice(2,10)+Date.now().toString(16).slice(-8);return{pwSalt:salt,pwHash:hashPw(salt,String(pw))}}
function checkPw(acc,pw){return !!(acc&&acc.pwHash&&hashPw(acc.pwSalt,String(pw))===acc.pwHash)}

function ins(col,rec,silent){rec.id=rec.id||uid(col.slice(0,3));rec._c=rec._c||now();rec._by=rec._by||userLabel();rec._v=1;DB[col].push(rec);if(!silent){logA('CREATE',col,rec.id,summ(rec));save()}return rec}
function upd(col,id,patch,reason){
  const r=get(col,id);if(!r)return null;
  DB.revisions.push({id:uid('rv'),col,rid:id,ts:now(),by:userLabel(),reason:reason||'',data:noPw(clone(r))});
  Object.assign(r,patch);r._u=now();r._ub=userLabel();r._v=(r._v||1)+1;
  logA('UPDATE',col,id,(reason?'Alasan: '+reason+' · ':'')+'Field: '+Object.keys(patch).join(', '));save();return r}
function del(col,id,reason){const r=get(col,id);if(!r)return;DB.revisions.push({id:uid('rv'),col,rid:id,ts:now(),by:userLabel(),reason:'HAPUS: '+(reason||''),data:noPw(clone(r))});r._del=true;r._delAt=now();r._delBy=userLabel();logA('DELETE (soft)',col,id,reason||summ(r));save()}

/* field: {k,l,t:text|number|date|time|textarea|select|multi|file|lines|email|checkbox|html, o:options[[v,l]]|[v], req, help, full, ro} */
function fieldHTML(f,v){
  const id='f_'+f.k;const req=f.req?' *':'';const full=f.full||['textarea','multi','lines','html'].includes(f.t)?'full':'';
  let inp='';const val=v??f.def??'';
  const opts=(optsOf(f.o)||[]).map(o=>Array.isArray(o)?o:[o,o]);
  if(f.t==='textarea')inp=`<textarea class="inp" id="${id}" ${f.ro?'readonly':''} rows="${f.rows||3}">${esc(val)}</textarea>`;
  else if(f.t==='lines')inp=`<textarea class="inp" id="${id}" rows="${f.rows||4}">${esc((val||[]).join('\n'))}</textarea>`;
  else if(f.t==='select')inp=`<select class="inp" id="${id}" ${f.ro?'disabled':''}>${f.blank!==false?'<option value="">— pilih —</option>':''}${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(val)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  else if(f.t==='multi'){const vs=(val||[]).map(String);inp=`<div class="chk" id="${id}">${opts.map(([a,b])=>`<label><input type="checkbox" value="${esc(a)}" ${vs.includes(String(a))?'checked':''}> ${esc(b)}</label>`).join('')||'<span class="muted small">Tidak ada pilihan</span>'}</div>`}
  else if(f.t==='file')inp=`<input type="file" class="inp" id="${id}" ${f.accept?`accept="${f.accept}"`:''}>${val&&val.name?`<small>Berkas saat ini: ${esc(val.name)}</small>`:''}`;
  else if(f.t==='selectOther'){const known=opts.some(([a])=>String(a)===String(val));const oth=val&&!known;inp=`<select class="inp" id="${id}" onchange="document.getElementById('${id}_o').style.display=this.value==='__other'?'':'none'"><option value="">— pilih —</option>${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(val)?'selected':''}>${esc(b)}</option>`).join('')}<option value="__other" ${oth?'selected':''}>Lainnya (isi sendiri)</option></select><input class="inp" id="${id}_o" style="margin-top:6px;${oth?'':'display:none'}" placeholder="Tuliskan ${esc(f.l.toLowerCase())}" value="${oth?esc(val):''}">`}
  else if(f.t==='checkbox')inp=`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.cl||'Ya')}</label>`;
  else inp=`<input class="inp" id="${id}" type="${f.t||'text'}" value="${esc(val)}" ${f.ro?'readonly':''} ${f.t==='number'?'step="any"':''}>`;
  return `<label class="f ${full}"><span>${esc(f.l)}${req}</span>${inp}${f.help?`<small>${esc(f.help)}</small>`:''}</label>`}
function readFile(file){return new Promise(res=>{if(!file)return res(null);const r=new FileReader();r.onload=()=>res({name:file.name,type:file.type,size:file.size,data:r.result,at:now()});r.readAsDataURL(file)})}
async function collect(fields){
  const o={};
  for(const f of fields){const el=document.getElementById('f_'+f.k);if(!el)continue;
    if(f.t==='multi')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);
    else if(f.t==='lines')o[f.k]=el.value.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(f.t==='number')o[f.k]=el.value===''?null:+el.value;
    else if(f.t==='checkbox')o[f.k]=el.checked;
    else if(f.t==='selectOther')o[f.k]=el.value==='__other'?document.getElementById('f_'+f.k+'_o').value.trim():el.value;
    else if(f.t==='file'){const fl=el.files[0];if(fl){if(fl.size>15e6){toast('Berkas > 15 MB tidak disimpan di peramban; simpan di server.');continue}o[f.k]=await readFile(fl)}}
    else o[f.k]=el.value.trim();
    if(f.req&&(o[f.k]===''||o[f.k]==null||(Array.isArray(o[f.k])&&!o[f.k].length))&&f.t!=='file'){toast('Wajib diisi: '+f.l);return null}}
  return o}
function openForm({title,fields,data={},onSave,wide,raw,note}){
  const isEdit=!!data.id;
  const fs=[...fields];if(raw&&isEdit)fs.push({k:'_reason',l:'Alasan perubahan (data penelitian mentah — wajib)',req:true,full:true});
  modal(title,`${note?`<div class="note">${note}</div>`:''}<div class="fg">${fs.map(f=>fieldHTML(f,data[f.k])).join('')}</div>`,
   `<button class="btn" onclick="closeModal()">Batal</button><button class="btn p" onclick="${on(async()=>{const v=await collect(fs);if(!v)return;const reason=v._reason;delete v._reason;closeModal();onSave(v,reason)})}">Simpan</button>`,wide)}
/* Generic CRUD table */
function crud(col,{fields,cols,filter,defaults={},title='',canEdit=isStaff(),extra,sort,raw=RAW.has(col),addLabel='Tambah',exportName,note,onAdd}){
  let rows=all(col,filter);if(sort)rows.sort(sort);
  const head=[...cols.map(c=>[c.l,c.c||'']),'Aksi'];
  const body=rows.map(r=>[...cols.map(c=>c.v?c.v(r):esc(r[c.k])),
    `<div class="btns">${extra?extra(r):''}${canEdit?btn('Edit',()=>openForm({title:'Edit '+title,fields,data:r,raw,onSave:(v,reason)=>{upd(col,r.id,v,reason);render()}}),'sm'):''}${canEdit?btn('Hapus',()=>confirmBox('Hapus data ini? Data tidak dihapus permanen — ditandai terhapus dan tetap tercatat di riwayat.',(rs)=>{del(col,r.id,rs);render()},true),'sm d'):''}</div>`]);
  const acts=`${canEdit?btn(addLabel,()=>{if(onAdd)return onAdd();openForm({title:'Tambah '+title,fields,data:{},onSave:v=>{ins(col,Object.assign({},defaults,v));render()}})},'p','plus'):''}${btn('Excel',()=>exportRows(exportName||col,rows.map(r=>rowOut(r,cols)),'xlsx'),'sm','down')}${btn('CSV',()=>exportRows(exportName||col,rows.map(r=>rowOut(r,cols)),'csv'),'sm','down')}`;
  return {acts,html:(note?`<div class="note">${note}</div>`:'')+tbl(head,body,{search:true})}}
function rowOut(r,cols){const o={};cols.forEach(c=>{let v=c.x?c.x(r):(c.k?r[c.k]:'');if(Array.isArray(v))v=v.join('; ');if(v&&typeof v==='object')v=v.name||JSON.stringify(v);o[c.l.replace(/<[^>]+>/g,'')]=v??''});return o}

function dl(name,content,mime){const b=content instanceof Blob?content:new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);logA('EXPORT','-','-',name)}
function toCSV(rows){if(!rows.length)return '';const keys=uniq(rows.flatMap(r=>Object.keys(r)));const q=v=>{v=v==null?'':typeof v==='object'?JSON.stringify(v):String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return keys.map(q).join(',')+'\n'+rows.map(r=>keys.map(k=>q(r[k])).join(',')).join('\n')}

  if(f||row.length){row.push(f);rows.push(row)}const hd=(rows.shift()||[]).map(h=>h.trim().toLowerCase().replace(/^﻿/,''));return rows.filter(r=>r.some(x=>x.trim())).map(r=>{const o={};hd.forEach((h,i)=>o[h]=(r[i]||'').trim());return o})}

   ${btn('Semua hadir',()=>{ss.forEach(s=>{if(!attOf(s.id,tm))ins('attendance',{classId:S.classId,tm,studentId:s.id,status:'H',time:now(),note:''},true)});logA('CREATE','attendance','TM'+tm,'Isi massal hadir');save();render()},'sm t')}
   ${DB.settings.selfAttendance&&m?btn(m.attOpen?'Tutup presensi mandiri':'Buka presensi mandiri',()=>{upd('meetings',m.id,{attOpen:!m.attOpen});render()},'sm pu'):''}</div>`+
   tbl(['NIM','Nama','Status','Waktu','Catatan','Riwayat'],ss.map(s=>{const r=attOf(s.id,tm);const hist=r?revsOf('attendance',r.id).length:0;return [s.nim,esc(s.nama),`<div class="att">${Object.keys(ATT).map(k=>`<button class="${r?.status===k?'on '+k:''}" title="${ATT[k]}" onclick="${on(()=>setAtt(s.id,tm,k))}">${k}</button>`).join('')}</div>`,r?fmtDT(r.time):'-',r?`<input class="inp sm" value="${esc(r.note||'')}" onchange="${on(e=>upd('attendance',r.id,{note:e.target.value},'Catatan dosen'))}">`:'',hist?btn(hist+' koreksi',()=>showRevs('attendance',r.id),'sm'):'']}))) };
function setAtt(sid,tm,st){const r=attOf(sid,tm);if(!r){ins('attendance',{classId:S.classId,tm,studentId:sid,status:st,time:now(),note:''});render();return}if(r.status===st)return;
  modal('Koreksi presensi',`<p>Ubah status <b>${esc(sName(sid))}</b> TM ${tm} dari <b>${ATT[r.status]}</b> menjadi <b>${ATT[st]}</b>.</p><label class="f"><span>Alasan koreksi (wajib)</span><input id="corR" class="inp"></label>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn p" onclick="${on(()=>{const v=document.getElementById('corR').value.trim();if(!v){toast('Alasan wajib');return}upd('attendance',r.id,{status:st},v);closeModal();render()})}">Simpan</button>`)}
function showRevs(col,id){const rv=revsOf(col,id);modal('Riwayat perubahan',tbl(['Waktu','Oleh','Alasan','Data sebelum'],rv.map(v=>[fmtDT(v.ts),esc(v.by),esc(v.reason),`<code class="small">${esc(JSON.stringify(Object.fromEntries(Object.entries(v.data).filter(([k])=>!k.startsWith('_')))).slice(0,300))}</code>`])),'',true)}
function attRows(){return classStuds().map(s=>{const a=attStat(s.id);const o={NIM:s.nim,Nama:s.nama,Kelompok:s.kelompok};meetings().forEach(m=>{o['TM'+m.no]=attOf(s.id,m.no)?.status||''});Object.assign(o,{Hadir:a.H,Terlambat:a.T,Izin:a.I,Sakit:a.S,Alpa:a.A,'% Kehadiran':a.pct==null?'':+a.pct.toFixed(1),'Di bawah batas':a.pct!=null&&a.pct<DB.settings.minAttendance?'YA':''});return o})}
function exportAtt(f){exportRows('presensi',attRows(),f,{Rekap:attRows(),'Data mentah':all('attendance',a=>a.classId===S.classId).map(a=>({TM:a.tm,NIM:get('students',a.studentId)?.nim,Status:a.status,Waktu:a.time,Catatan:a.note,Versi:a._v,Mandiri:a.self?'Ya':''}))})}

  const ss=classStuds();const lk=get('lkm',m.lkmId);const sub=all('lkmAns',a=>a.lkmId===m.lkmId&&a.classId===S.classId);

  `<div class="grid g2">${sec(1,'Identitas pertemuan',`<p>TM ${no} · ${fmtD(m.date)} · ${esc(course()?.name||'')} · ${esc(cls()?.name||'')}</p>`)}${sec(2,'Tujuan pembelajaran',`<p>${esc(m.tujuan||'-')}</p>`)}${sec(3,'Materi',`<p>${esc(m.materi||'-')}</p>`)}
  ${sec(4,'Tahapan sintaks',(m.stageIds||[]).map(id=>badge(stageName(id),'b-pu')).join(' ')||'<span class="muted">-</span>')}${sec(5,'Aktivitas dosen',`<p>${esc(m.aktDosen||'')||(m.stageIds||[]).map(id=>esc(get('stages',id)?.aktDosen)).join('<br>')}</p>`)}${sec(6,'Aktivitas mahasiswa',`<p>${esc(m.aktMhs||'')||(m.stageIds||[]).map(id=>esc(get('stages',id)?.aktMhs)).join('<br>')}</p>`)}
  ${sec(7,'LKM',lk?`<p>${esc(lk.title)} · ${sub.filter(x=>x.status==='Dikumpulkan').length}/${ss.length} dikumpulkan</p>${btn('Buka LKM',()=>go('lkm',{id:lk.id}),'sm')}`:'<span class="muted">Belum dikaitkan</span>')}
  ${sec(8,'Soal matematika / tes',(m.packageIds||[]).map(id=>{const pk=get('packages',id);return pk?`<div>${esc(pk.name)} · ${all('attempts',a=>a.packageId===id&&a.submit).length} pengumpulan ${btn('Buka',()=>go('tests',{pkg:id}),'sm')}</div>`:''}).join('')||'<span class="muted">-</span>')}
  ${sec(9,'Presensi',`<p>Hadir ${pct(attTM(no))}</p>${S.role!=='observer'?btn('Isi presensi',()=>go('attendance',{tm:no}),'sm'):''}`)}

  ${sec(12,'Penilaian individu',`<p>${all('pckScores',x=>+x.tm===no&&x.level==='individu'&&x.classId===S.classId).length} skor PCK individu · rata-rata ${n2(pckAvg(x=>+x.tm===no&&x.level==='individu'))}</p>${S.role!=='mahasiswa'?btn('Input PCK',()=>go('pck',{tm:no}),'sm'):''}`)}

  ${sec(14,'Dokumentasi',docList('tm',m.id)+(isStaff()||S.role==='observer'?btn('Unggah dokumentasi',()=>uploadDoc('tm',m.id),'sm','up'):''))}

function uploadDoc(kind,ref,extra={}){pickFile('*/*',async f=>{if(f.size>15e6){toast('Maks 15 MB per berkas di penyimpanan peramban');return}const d=await readFile(f);ins('docs',{kind,ref,classId:S.classId,...d,...extra});toast('Berkas diunggah');render()})}
function docList(kind,ref){const d=all('docs',x=>x.kind===kind&&x.ref===ref);return d.length?`<div style="margin-bottom:8px">${d.map(x=>`<div class="small btns">${icon('file',13)} <a style="cursor:pointer" onclick="${on(()=>openDoc(x))}">${esc(x.name)}</a> <span class="muted">${Math.round((x.size||0)/1024)} KB · ${fmtD(x.at)}</span>${isStaff()?btn('×',()=>confirmBox('Hapus berkas?',r=>{del('docs',x.id,r);render()},true),'sm d'):''}</div>`).join('')}</div>`:'<p class="muted small">Belum ada berkas.</p>'}

/* ---------------- MEETING REPORT (RAPOR PERTEMUAN) ---------------- */
function meetingReportData(no){const m=meetingByNo(no),ss=classStuds();const pk=pckList();
  const sc=(f)=>pckP(x=>+x.tm===no&&f(x));
  const lkmScore=m?.lkmId?mean(all('lkmAns',a=>a.lkmId===m.lkmId&&a.classId===S.classId).map(a=>a.score)):null;
  const lat=(m?.packageIds||[]).map(id=>get('packages',id)).filter(p=>p&&p.kind==='latihan');
  const latScore=mean(lat.flatMap(p=>ss.map(s=>attemptResult(attemptOf(p.id,s.id))?.pct)));
  const ac={'Kehadiran mahasiswa (%)':attTM(no),'Penyelesaian LKM (%)':lkmDone(no),'Skor LKM (rata-rata)':lkmScore,'Hasil latihan matematika (%)':latScore,'Keaktifan mahasiswa (obs. %)':obsTypePct('Aktivitas mahasiswa',no),'Hasil diskusi (obs. %)':obsTypePct('Aktivitas diskusi',no),'Hasil kerja kelompok (PCK kelompok %)':sc(x=>x.level==='kelompok')};
  const im={'Keterlaksanaan sintaks (fidelity %)':fidTM(no),...Object.fromEntries(stages().map(s=>['· Tahap '+s.name,fidTM(no,s.id)])),'Aktivitas dosen (obs. %)':obsTypePct('Aktivitas dosen',no),'Aktivitas mahasiswa (obs. %)':obsTypePct('Aktivitas mahasiswa',no),'Implementasi Growth Mindset (obs. %)':obsTypePct('Implementasi Growth Mindset',no)};
  const pc={'KCS (%)':sc(x=>x.indicator.startsWith('KCS')),'KCT (%)':sc(x=>x.indicator.startsWith('KCT')),'Mengidentifikasi kesulitan siswa (KCS2)':sc(x=>x.indicator==='KCS2'),'Menganalisis miskonsepsi (KCS3)':sc(x=>x.indicator==='KCS3'),'Memilih strategi pembelajaran (KCT4)':sc(x=>x.indicator==='KCT4'),'Merancang pembelajaran (KCT3)':sc(x=>x.indicator==='KCT3'),'Respons pedagogis (KCT5)':sc(x=>x.indicator==='KCT5')};
  const notes=all('obsRec',r=>r.classId===S.classId&&+r.tm===no&&r.notes).map(r=>({by:get('users',r.observerId)?.name,inst:get('obsInst',r.instId)?.type,t:r.notes}));
  const qc=all('qcodes',q=>q.classId===S.classId&&+q.tm===no);
  const refl=all('reflections',r=>r.classId===S.classId&&+r.tm===no);
  const rep=all('meetingReports',r=>r.classId===S.classId&&+r.tm===no)[0]||{};
  return{m,ac,im,pc,notes,qc,refl,rep}}
PAGES.mreport=(p)=>{const no=+(p.tm||1);const d=meetingReportData(no);const mt=meetings();
  const sect=(t,o)=>card(t,tbl(['Aspek',['Nilai','n'],''],Object.entries(o).map(([k,v])=>[esc(k),k.includes('rata-rata)')?n2(v):pct(v),v!=null&&!k.includes('rata-rata)')?bar(v):''])));
  const R=d.rep;const fields=[['temuan','Temuan penting'],['kendala','Kendala'],['refDosen','Refleksi dosen'],['refMhs','Refleksi mahasiswa (ringkasan)'],['kualitatif','Analisis kualitatif (berdasarkan bukti terkode)'],['rekomendasi','Rekomendasi perbaikan pertemuan berikutnya']];
  const body=()=>`<div class="grid g3">${sect('A. Aspek akademik',d.ac)}${sect('B. Aspek implementasi model',d.im)}${sect('C. Aspek perkembangan PCK',d.pc)}</div>`+
   card('Visualisasi',barChart(['Hadir','LKM','Fidelity','Akt. dosen','Akt. mhs','GM','KCS','KCT'],[{name:'%',values:[d.ac['Kehadiran mahasiswa (%)'],d.ac['Penyelesaian LKM (%)'],d.im['Keterlaksanaan sintaks (fidelity %)'],d.im['Aktivitas dosen (obs. %)'],d.im['Aktivitas mahasiswa (obs. %)'],d.im['Implementasi Growth Mindset (obs. %)'],d.pc['KCS (%)'],d.pc['KCT (%)']]}],{max:100}))+
   card('Catatan observer & respons mahasiswa',tbl(['Observer','Instrumen','Catatan'],d.notes.map(n=>[esc(n.by),esc(n.inst),esc(n.t)])))+
   card('Bukti kualitatif terkode (TM '+no+')',`<div class="note">Kesimpulan kualitatif tidak dibuat otomatis. Berikut bukti yang dapat diperiksa; interpretasi ditulis peneliti.</div>`+tbl(['Tema','Kode','Kutipan/bukti','Sumber','Anonim'],d.qc.map(q=>[esc(q.tema),esc(q.kode),esc(q.kutipan),esc(q.sumber),esc(q.anon)]))+`<p class="small muted">${d.refl.length} refleksi mahasiswa tercatat pada TM ini.</p>`)+
   card('Analisis & rekomendasi',fields.map(([k,l])=>`<h4>${l}</h4><div class="ans" style="margin-bottom:10px">${esc(R[k]||'— belum diisi —')}</div>`).join(''));
  const rows=()=>[...Object.entries(d.ac).map(([k,v])=>({Dimensi:'Akademik',Aspek:k,Nilai:v==null?'':+v.toFixed(2)})),...Object.entries(d.im).map(([k,v])=>({Dimensi:'Implementasi model',Aspek:k,Nilai:v==null?'':+v.toFixed(2)})),...Object.entries(d.pc).map(([k,v])=>({Dimensi:'PCK',Aspek:k,Nilai:v==null?'':+v.toFixed(2)})),...fields.map(([k,l])=>({Dimensi:'Kualitatif',Aspek:l,Nilai:R[k]||''}))];
  return ph('Rapor Pertemuan','Rapor TM '+no+' — '+esc(d.m?.title||''),'Ringkasan kuantitatif dihitung dari presensi, LKM, observasi, dan skor PCK yang terhubung; bagian kualitatif diisi dosen/peneliti.',
   `<select class="inp sm" onchange="go('mreport',{tm:this.value})">${mt.map(x=>`<option value="${x.no}" ${x.no===no?'selected':''}>TM ${x.no}</option>`).join('')}</select>`+btn('Edit Laporan',()=>openForm({title:'Edit Rapor TM '+no,wide:true,fields:fields.map(([k,l])=>({k,l,t:'textarea',full:true})),data:R,onSave:v=>{if(R.id)upd('meetingReports',R.id,v);else ins('meetingReports',{classId:S.classId,tm:no,...v});render()}}),'p','edit')+btn('Unduh PDF',()=>printHTML('Rapor Pertemuan TM '+no,body()),'','print')+btn('Ekspor Excel',()=>exportRows('rapor_TM'+no,rows(),'xlsx'),'','down')+btn('Cetak',()=>printHTML('Rapor Pertemuan TM '+no,body()),'','print'))+body()};

/* ---------------- RPS & CPMK ---------------- */
function subAch(sc){const parts=[];const ss=classStuds();
  if((sc.pck||[]).length){const v=pckP(x=>sc.pck.includes(x.indicator)&&x.level==='individu'&&(!(sc.tms||[]).length||sc.tms.map(Number).includes(+x.tm)));if(v!=null)parts.push(v)}
  (sc.pkg||[]).forEach(id=>{const v=mean(ss.map(s=>attemptResult(attemptOf(id,s.id))?.pct));if(v!=null)parts.push(v)});
  (sc.lkm||[]).forEach(id=>{const v=mean(all('lkmAns',a=>a.lkmId===id&&a.classId===S.classId).map(a=>a.score));if(v!=null)parts.push(v)});
  (sc.obs||[]).forEach(id=>{const v=mean(obsRecs(id,null).map(obsPct));if(v!=null)parts.push(v)});
  return parts.length?mean(parts):null}

function progressFor(s){const out=[];meetings().forEach(m=>{
  out.push({tm:m.no,act:'Membaca materi',st:all('readMarks',r=>r.studentId===s.id&&+r.tm===m.no).length?'y':'n'});
  if(m.lkmId)out.push({tm:m.no,act:'LKM',st:all('lkmAns',a=>a.lkmId===m.lkmId&&a.studentId===s.id&&a.status==='Dikumpulkan').length?'y':'n'});
  (m.packageIds||[]).forEach(id=>out.push({tm:m.no,act:'Tes: '+(get('packages',id)?.name||''),st:attemptOf(id,s.id)?'y':'n'}));
  if((m.stageIds||[]).length)out.push({tm:m.no,act:'Refleksi',st:all('reflections',r=>r.studentId===s.id&&+r.tm===m.no).length?'y':'n'});
  const mts=all('mtSessions',x=>x.classId===S.classId&&+x.tm===m.no&&x.roles?.[s.id]);if(mts.length)out.push({tm:m.no,act:'Microteaching',st:mts.every(x=>x.status==='Selesai')?'y':'n'})});return out}

  const act=p.act||'Semua';const ss=classStuds();

  const inc=ss.map(s=>({s,n:progressFor(s).filter(x=>x.st==='n'&&(act==='Semua'||x.act.startsWith(act))).length})).filter(x=>x.n);
  return ph('Learning Progress Tracker','Monitoring Penyelesaian Aktivitas','Status membaca materi, LKM, tes, refleksi, dan microteaching — dihitung langsung dari data modul terkait.',btn('Kirim pengingat ke yang belum selesai',()=>{inc.forEach(x=>ins('notifications',{studentId:x.s.id,text:`Anda memiliki ${x.n} aktivitas yang belum diselesaikan. Lihat menu Learning Progress.`,at:now(),read:false},true));save();toast(inc.length+' pengingat dikirim')},'pu','bell')+btn('Excel',()=>exportRows('progress',ss.flatMap(s=>progressFor(s).map(x=>({NIM:s.nim,Nama:s.nama,TM:x.tm,Aktivitas:x.act,Status:x.st==='y'?'Selesai':'Belum'}))),'xlsx'),'','down'))+
  tabs(['Semua',...acts].map(a=>[a,a]),act,v=>go('progress',{act:v}))+
  card('Matriks progres (selesai/total aktivitas)',tbl(['Mahasiswa',...mt.map(m=>['TM'+m.no,'c']),'% selesai'],ss.map(s=>{const pr=progressFor(s).filter(x=>act==='Semua'||x.act.startsWith(act));return [esc(s.nama),...mt.map(m=>cell(s,m)),pct(pr.filter(x=>x.st==='y').length/Math.max(1,pr.length)*100,0)]}),{cls:'matrix'}))+
  card('Notifikasi aktivitas belum selesai',tbl(['Mahasiswa','Jumlah belum selesai','Daftar'],inc.map(x=>[esc(x.s.nama),x.n,progressFor(x.s).filter(y=>y.st==='n'&&(act==='Semua'||y.act.startsWith(act))).slice(0,6).map(y=>'TM'+y.tm+' '+y.act).join(', ')])))};

let TIMER=null;
function takeTest(pk,s){if(!pk)return '';let draft=all('attempts',a=>a.packageId===pk.id&&a.studentId===s.id&&!a.submit)[0];if(!draft)draft=ins('attempts',{packageId:pk.id,studentId:s.id,answers:{},scores:{},manual:{},start:now(),status:'Mengerjakan',order:pk.shuffle?[...pk.qids].sort(()=>Math.random()-.5):pk.qids});
  const qs=(draft.order||pk.qids).map(id=>get('questions',id)).filter(Boolean);const end=new Date(draft.start).getTime()+(pk.duration||60)*60000;

   if(q.tipe==='isian')return `<input class="inp" name="${nm}" value="${esc(a||'')}">`;return `<textarea class="inp" name="${nm}" rows="5">${esc(a||'')}</textarea>`};

function indTable(pk){const ss=classStuds();return tbl(['Indikator','Domain','Rata-rata','Maks','%',''],pckList().map(x=>{const v=ss.map(s=>attemptResult(pk&&attemptOf(pk.id,s.id))?.byInd[x.code]).filter(Boolean);const m=mean(v.map(a=>a.s)),mx=mean(v.map(a=>a.m));return [x.code+' '+esc(x.name),x.domain,n2(m),n2(mx,0),pct(mx?m/mx*100:null),bar(mx?m/mx*100:null)]}))}

  const need=pckList().map(x=>{const v=res.map(r=>r.r?.byInd[x.code]).filter(Boolean);const p=v.length?sum(v.map(a=>a.s))/sum(v.map(a=>a.m))*100:null;return{x,p}}).filter(o=>o.p!=null).sort((a,b)=>a.p-b.p);

  `<div class="grid g4">${kpi('Peserta pretest',vals.length+' / '+ss.length,'','var(--navy)')}${kpi('Rata-rata kelas',pct(mean(vals)),'SD '+n2(ST.sd(vals)),'var(--amber)')}${kpi('Rentang',vals.length?pct(Math.min(...vals),0)+' – '+pct(Math.max(...vals),0):'-','','var(--blue)')}${kpi('GM awal (rata-rata)',n2(mean(res.map(x=>x.g?.mean))),res.filter(x=>x.g).length+' responden','var(--purple)')}</div>`+
  `<div class="grid g2" style="margin-top:16px">${card('Distribusi skor pretest (%)',histo(vals,5,0,100,'Mahasiswa'))}${card('Hasil per indikator PCK',indTable(pk))}</div>`+
  card('Identifikasi kebutuhan pembelajaran',`<div class="note">Diurutkan dari capaian terendah berdasarkan data skor. Penetapan kebutuhan prioritas tetap keputusan dosen/peneliti.</div>`+tbl(['Indikator','Capaian',''],need.map(o=>[o.x.code+' '+esc(o.x.name),pct(o.p),bar(o.p)])))+
  card('Profil asesmen awal setiap mahasiswa',tbl(['NIM','Nama','Pretest %','KCS','KCT','GM awal','Kategori GM'],res.map(({s,r,g})=>{const d=(dom)=>{if(!r)return '-';const v=Object.entries(r.byInd).filter(([k])=>k.startsWith(dom));const a=sum(v.map(x=>x[1].s)),m=sum(v.map(x=>x[1].m));return m?pct(a/m*100,0):'-'};return [s.nim,`<a style="cursor:pointer" onclick="go('profile',{sid:'${s.id}'})">${esc(s.nama)}</a>`,r?pct(r.pct):'-',d('KCS'),d('KCT'),n2(g?.mean),esc(gmCat(g?.mean))]}),{search:true}))};
PAGES.posttest=()=>{const {pre,post,rows}=prePost();const pk=pckList();const pr=rows.filter(r=>r.a&&r.b);const t=ST.paired(pr.map(r=>r.a.pct),pr.map(r=>r.b.pct));
  return ph('Asesmen Akhir (TM 16)','Posttest & Perbandingan Pretest–Posttest','Paket pretest dan posttest terpisah, dipetakan pada 11 indikator PCK.',(post?btn(post.active?'Nonaktifkan posttest':'Aktifkan posttest',()=>{upd('packages',post.id,{active:!post.active});render()},'p')+btn('Penilaian & data mentah',()=>go('tests',{pkg:post.id})):btn('Buat paket posttest',()=>go('tests'),'p'))+btn(DB.settings.gm.open.akhir?'Tutup angket GM akhir':'Buka angket GM akhir',()=>{DB.settings.gm.open.akhir=!DB.settings.gm.open.akhir;save();render()},'pu')+btn('Analisis efektivitas',()=>go('effect'),'','chart'))+

  card('Hasil posttest per indikator',indTable(post))+
  card('Skor individu',tbl(['NIM','Nama','Pre','Post','Selisih','N-gain','Kategori'],rows.map(({s,a,b})=>{const g=a&&b?ST.ngain(a.pct,b.pct,100):null;return [s.nim,esc(s.nama),a?pct(a.pct):'-',b?pct(b.pct):'-',a&&b?n2(b.pct-a.pct,1):'-',n2(g),ST.ngainCat(g)]}),{search:true}))};

PAGES.fidelity=()=>{const fi=fidInst();const mt=meetings();const st=stages();if(!fi)return card('Instrumen keterlaksanaan belum ada','');
  const comps=uniq(fi.indicators.map(d=>d.comp).filter(Boolean));const cum=(fn)=>{let s=[];return mt.map(m=>{const v=fn(m.no);if(v!=null)s.push(v);return s.length?mean(s):null})};
  const compP=(c,tm)=>{const inds=fi.indicators.filter(d=>d.comp===c);const v=obsRecs(fi.id,tm).flatMap(r=>inds.map(d=>+r.scores?.[d.no]).filter(x=>!isNaN(x)));return v.length?sum(v)/(v.length*fi.max)*100:null};

  const iv=items.filter(x=>x.icvi!=null).map(x=>x.icvi);return{rs,items,aspects,scviAve:iv.length?mean(iv):null,scviUA:iv.length?iv.filter(x=>x===1).length/iv.length:null,n:rs.length}}

  `<div class="note">"Ambil dari skor PCK ganda" otomatis menyusun set dari skor PCK yang dinilai lebih dari satu penilai untuk mahasiswa, TM, sumber, dan indikator yang sama.</div>`+card('Set data',c.html,c.acts)};
function irrFromPCK(){const g={};all('pckScores',x=>x.classId===S.classId&&x.level==='individu').forEach(x=>{const k=[x.studentId,x.tm,x.source,x.indicator].join('|');(g[k]=g[k]||{})[x.raterId]=x.score});
  const multi=Object.entries(g).filter(([k,v])=>Object.keys(v).length>=2);if(!multi.length){toast('Tidak ada skor PCK yang dinilai ≥ 2 penilai');return}
  const raters=uniq(multi.flatMap(([k,v])=>Object.keys(v)));const subjects=[],scores={};multi.forEach(([k,v],i)=>{const [sid,tm,src,ind]=k.split('|');const lab=`${get('students',sid)?.anon} TM${tm} ${ind}`;subjects.push(lab);scores[i]={};raters.forEach((r,j)=>{if(v[r]!=null)scores[i][j]=v[r]})});
  const s=ins('irrSets',{name:'Skor PCK ganda — '+new Date().toLocaleDateString('id-ID'),dataType:'ordinal',raters:raters.map(r=>get('users',r)?.name||r),subjects,scores,source:'pckScores'});go('irr',{id:s.id})}
function irrDetail(set){const R=set.raters||[],Sb=set.subjects||[];const sc=set.scores||{};
  const complete=Sb.map((_,i)=>R.map((_,j)=>sc[i]?.[j])).filter(r=>r.every(v=>v!==undefined&&v!==''&&v!==null));
  let res='';const k=R.length;
  if(complete.length<2)res='<p class="muted">Isi minimal 2 subjek dengan skor lengkap dari semua penilai.</p>';
  else{const agreeAll=complete.filter(r=>r.every(v=>String(v)===String(r[0]))).length/complete.length;const rows=[['Persentase kesepakatan mutlak',pct(agreeAll*100),'']];
    if(set.dataType==='nominal'){if(k===2){const kp=ST.kappa(complete.map(r=>String(r[0])),complete.map(r=>String(r[1])));rows.push(["Cohen's Kappa",n2(kp.k,3),ST.kInterp(kp.k)],['Po / Pe',n2(kp.po,3)+' / '+n2(kp.pe,3),''])}else{const f=ST.fleiss(complete.map(r=>r.map(String)));rows.push(["Fleiss' Kappa",n2(f,3),ST.kInterp(f)])}}
    if(set.dataType==='ordinal'){if(k===2){const a=complete.map(r=>+r[0]),b=complete.map(r=>+r[1]);const kp=ST.kappa(a.map(String),b.map(String));rows.push(["Cohen's Kappa (tak berbobot)",n2(kp.k,3),ST.kInterp(kp.k)],["Weighted Kappa (linear)",n2(ST.wkappa(a,b,'linear'),3),ST.kInterp(ST.wkappa(a,b,'linear'))],["Weighted Kappa (kuadratik)",n2(ST.wkappa(a,b,'quadratic'),3),ST.kInterp(ST.wkappa(a,b,'quadratic'))])}const ic=ST.icc(complete.map(r=>r.map(Number)));if(ic)rows.push(['ICC(2,1) absolute agreement',n2(ic.icc21,3),ST.iccInterp(ic.icc21)],['ICC(2,k) rata-rata penilai',n2(ic.icc2k,3),ST.iccInterp(ic.icc2k)])}
    if(set.dataType==='interval'){const ic=ST.icc(complete.map(r=>r.map(Number)));rows.push(['ICC(2,1) absolute agreement, single',n2(ic.icc21,3),ST.iccInterp(ic.icc21)],['ICC(2,k) absolute agreement, average',n2(ic.icc2k,3),ST.iccInterp(ic.icc2k)],['ICC(3,1) consistency, single',n2(ic.icc31,3),ST.iccInterp(ic.icc31)],['ICC(3,k) consistency, average',n2(ic.icc3k,3),ST.iccInterp(ic.icc3k)],['MSR / MSC / MSE',`${n2(ic.MSR,3)} / ${n2(ic.MSC,3)} / ${n2(ic.MSE,3)}`,''])}
    res=tbl(['Statistik','Nilai','Interpretasi'],rows)+`<p class="small muted">n = ${complete.length} subjek lengkap, ${k} penilai. Interpretasi Kappa: Landis & Koch (1977); ICC: Koo & Li (2016). Pilih statistik yang sesuai desain penelitian.</p>`;
    if(k>=2){res+='<h4>Perbandingan antarpenilai</h4>'+tbl(['Pasangan',['Rata-rata A','n'],['Rata-rata B','n'],['% sepakat','n'],['Selisih rata-rata absolut','n']],R.flatMap((a,i)=>R.slice(i+1).map((b,jj)=>{const j=i+1+jj;const A=complete.map(r=>+r[i]),B=complete.map(r=>+r[j]);return [esc(a)+' vs '+esc(b),n2(mean(A)),n2(mean(B)),pct(A.filter((x,z)=>x===B[z]).length/A.length*100),n2(mean(A.map((x,z)=>Math.abs(x-B[z]))))]})))}}
  return ph('Inter-Rater Reliability',esc(set.name),'Jenis data: '+set.dataType,btn('← Set',()=>go('irr'))+btn('Edit set',()=>openForm({title:'Edit set',raw:true,fields:[{k:'name',l:'Nama'},{k:'dataType',l:'Jenis data',t:'select',o:['nominal','ordinal','interval']},{k:'raters',l:'Penilai',t:'lines'},{k:'subjects',l:'Subjek',t:'lines'}],data:set,onSave:(v,r)=>{upd('irrSets',set.id,v,r);render()}}),'','edit')+btn('Laporan PDF',()=>printHTML('Laporan Reliabilitas Penilai — '+set.name,res+rowsTable(Sb.map((s,i)=>({Subjek:s,...Object.fromEntries(R.map((r,j)=>[r,sc[i]?.[j]]))})))),'','print')+btn('Excel',()=>exportRows('irr',Sb.map((s,i)=>({Subjek:s,...Object.fromEntries(R.map((r,j)=>[r,sc[i]?.[j]]))})),'xlsx'),'','down'))+
  card('Hasil analisis kesepakatan',res)+card('Input skor penilai',tbl(['Subjek',...R.map(r=>[esc(r),'c']),'Sepakat?'],Sb.map((s,i)=>[esc(s),...R.map((r,j)=>`<input class="inp sm" style="width:64px" data-i="${i}" data-j="${j}" value="${esc(sc[i]?.[j]??'')}">`),(()=>{const v=R.map((_,j)=>sc[i]?.[j]);return v.every(x=>x!=null&&x!=='')?(v.every(x=>String(x)===String(v[0]))?badge('Ya','b-ok'):badge('Tidak','b-warn')):''})()]),{h:'420px'})+`<label class="f" style="margin-top:8px"><span>Alasan perubahan (wajib bila mengubah skor yang ada)</span><input class="inp" id="irrR"></label>`+btn('Simpan skor',()=>{const n={};let changed=false;document.querySelectorAll('[data-i]').forEach(e=>{const i=e.dataset.i,j=e.dataset.j;(n[i]=n[i]||{});if(e.value!=='')n[i][j]=isNaN(+e.value)?e.value:+e.value;if(sc[i]?.[j]!=null&&String(sc[i][j])!==e.value)changed=true});const r=document.getElementById('irrR').value.trim();if(changed&&!r){toast('Alasan wajib');return}upd('irrSets',set.id,{scores:n},r||'Input skor penilai');render()},'p'))}

function itemMatrix(pk){const qs=pk.qids.map(id=>get('questions',id)).filter(Boolean);const ats=all('attempts',a=>a.packageId===pk.id&&a.submit);
  const M=ats.map(a=>qs.map(q=>{let s=a.manual?.[q.id]?.score??a.scores?.[q.id];return s==null?0:+s}));return{qs,ats,M}}
function itemAnalysis(pk){const {qs,ats,M}=itemMatrix(pk);const n=M.length;if(n<3)return null;const tot=M.map(r=>sum(r));const ord=tot.map((t,i)=>[t,i]).sort((a,b)=>b[0]-a[0]);const g=Math.max(1,Math.round(n*0.27));const up=ord.slice(0,g).map(x=>x[1]),lo=ord.slice(-g).map(x=>x[1]);
  const items=qs.map((q,j)=>{const mx=qMax(q);const col=M.map(r=>r[j]);const p=mean(col)/mx;const D=(mean(up.map(i=>M[i][j]))-mean(lo.map(i=>M[i][j])))/mx;const rest=M.map((r,i)=>tot[i]-r[j]);const r=ST.pearson(col,rest);const rit=ST.pearson(col,tot);
    let dis=null;if(q.tipe==='pg'&&(q.options||[]).length){dis=q.options.map((o,k)=>{const L=String.fromCharCode(65+k);const ch=ats.map(a=>a.answers?.[q.id]===L);const cnt=ch.filter(Boolean).length;const upC=up.filter(i=>ch[i]).length,loC=lo.filter(i=>ch[i]).length;return{L,o,key:L===q.key,cnt,prop:cnt/n,upC,loC,eff:L===q.key?null:(cnt/n>=0.05&&loC>=upC)}})}
    return{q,mx,p,D,r,rit,dis}});
  const dich=qs.every(q=>qMax(q)===1);const rel=dich?ST.kr20(M):ST.alpha(M);const sd=ST.sd(tot);
  return{items,n,rel,relName:dich?'KR-20':"Cronbach's Alpha",sem:sd!=null&&rel!=null?sd*Math.sqrt(1-rel):null,mean:mean(tot),sd,rcrit:n>2?rCrit(n):null}}
function rCrit(n){const df=n-2;/* t crit 0.05 two-tailed approx */const t=1.96+2.4/df+3/(df*df);return t/Math.sqrt(df+t*t)}
PAGES.item=(p)=>{const ps=all('packages',x=>x.classId===S.classId);const pk=get('packages',p.pkg)||ps[0];const view=p.view||'items';
  const head=ph('Evaluasi Penelitian','Item Analysis','Tingkat kesukaran, daya pembeda (kelompok atas–bawah 27%), analisis distraktor, validitas butir (korelasi butir–total terkoreksi), reliabilitas tes, dan kesetaraan pretest–posttest.',`<select class="inp sm" onchange="go('item',{pkg:this.value,view:'${view}'})">${ps.map(x=>`<option value="${x.id}" ${x.id===pk?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)+tabs([['items','Analisis butir'],['dist','Distraktor'],['eq','Kesetaraan pretest–posttest']],view,v=>go('item',{pkg:pk?.id,view:v}));
  if(view==='eq'){const pre=pkgOfKind('pretest')[0],post=pkgOfKind('posttest')[0];if(!pre||!post)return head+'<p>Perlu paket pretest dan posttest.</p>';const A=itemAnalysis(pre),B=itemAnalysis(post);if(!A||!B)return head+'<p>Data belum cukup (min. 3 peserta per paket).</p>';
    const byInd=(X)=>Object.fromEntries(pckList().map(x=>[x.code,X.items.filter(i=>i.q.pck===x.code)]));const a=byInd(A),b=byInd(B);
    const pa=A.items.map(i=>i.p),pb=B.items.map(i=>i.p);
    return head+`<div class="note">Kesetaraan bentuk dinilai dari kesamaan struktur (jumlah & bentuk butir per indikator), kemiripan tingkat kesukaran dan daya pembeda, serta reliabilitas setiap paket. Idealnya diuji pada kelompok yang sama sebelum perlakuan; data di bawah berasal dari pretest dan posttest aktual sehingga perbedaan kesukaran juga dipengaruhi perlakuan.</div>`+
    tbl(['Statistik',pre.name,post.name],[['Jumlah butir',A.items.length,B.items.length],['Peserta',A.n,B.n],['Rata-rata p (kesukaran)',n2(mean(pa)),n2(mean(pb))],['Rata-rata D (daya pembeda)',n2(mean(A.items.map(i=>i.D))),n2(mean(B.items.map(i=>i.D)))],[A.relName,n2(A.rel,3),n2(B.rel,3)],['SEM',n2(A.sem),n2(B.sem)]])+
    card('Per indikator PCK',tbl(['Indikator',['Butir pre','c'],['Butir post','c'],['p pre','n'],['p post','n'],['D pre','n'],['D post','n']],pckList().map(x=>[x.code,a[x.code].length,b[x.code].length,n2(mean(a[x.code].map(i=>i.p))),n2(mean(b[x.code].map(i=>i.p))),n2(mean(a[x.code].map(i=>i.D))),n2(mean(b[x.code].map(i=>i.D)))])))}
  if(!pk)return head+'<p>Belum ada paket.</p>';const A=itemAnalysis(pk);if(!A)return head+card('','<p>Minimal 3 peserta yang telah mengumpulkan.</p>');
  if(view==='dist')return head+A.items.filter(i=>i.dis).map(i=>card(esc(i.q.code)+' · kunci '+esc(i.q.key),tbl(['Opsi','Teks',['Dipilih','n'],['Proporsi','n'],['Kel. atas','n'],['Kel. bawah','n'],'Keterangan'],i.dis.map(d=>[d.L+(d.key?' ✓':''),esc(d.o),d.cnt,pct(d.prop*100),d.upC,d.loC,d.key?badge('Kunci','b-ok'):d.eff?badge('Berfungsi','b-ok'):badge('Tidak berfungsi (revisi)','b-warn')])))).join('')||head+'<p>Tidak ada butir pilihan ganda.</p>';
  const rows=()=>A.items.map(i=>({Kode:i.q.code,Bentuk:i.q.tipe,PCK:i.q.pck,p:+i.p.toFixed(3),Kesukaran:ST.pInterp(i.p),D:+i.D.toFixed(3),'Daya pembeda':ST.dInterp(i.D),'r butir-total terkoreksi':i.r==null?'':+i.r.toFixed(3),'r tabel (α=0,05)':A.rcrit&&+A.rcrit.toFixed(3),Validitas:i.r==null?'-':i.r>=A.rcrit?'Valid':'Tidak valid'}));
  return head+`<div class="grid g4">${kpi('Peserta',A.n,'','var(--navy)')}${kpi(A.relName,n2(A.rel,3),'reliabilitas tes','var(--purple)')}${kpi('Rata-rata skor',n2(A.mean),'SD '+n2(A.sd),'var(--teal)')}${kpi('SEM',n2(A.sem),'r tabel '+n2(A.rcrit,3),'var(--amber)')}</div>`+
  card('Analisis butir',tbl(['Butir','Bentuk','PCK',['p','n'],'Kesukaran',['D','n'],'Daya pembeda',['r it-kor','n'],'Validitas'],A.items.map(i=>[esc(i.q.code),i.q.tipe,i.q.pck||'',n2(i.p),ST.pInterp(i.p),n2(i.D),ST.dInterp(i.D),n2(i.r,3),i.r==null?'-':i.r>=A.rcrit?badge('Valid','b-ok'):badge('Tidak valid','b-bad')])),btn('Excel',()=>exportRows('analisis_butir_'+pk.kind,rows(),'xlsx'),'sm','down')+btn('PDF',()=>printHTML('Analisis Butir — '+pk.name,rowsTable(rows())+`<p>${A.relName}: ${n2(A.rel,3)} · SEM ${n2(A.sem)} · n=${A.n}</p>`),'sm','print'))+
  `<div class="note small">p = rata-rata skor/skor maksimum. D = (rerata kelompok atas − bawah)/maks, kelompok 27%. Validitas: r butir–total terkoreksi dibandingkan r tabel (pendekatan, α = 0,05 dua sisi). Uraian/kasus diperlakukan sebagai butir politomus (0–3).</div>`};

const CONF=Object.assign({GAS_URL:''},window.RLGM_CONFIG||{});
function gasUrl(){try{const v=localStorage.getItem('rlgm_gas');return v!==null?v:CONF.GAS_URL}catch(e){return CONF.GAS_URL}}
function serverMode(){return !!gasUrl()}
const SY={token:null,exp:0,uid:null,base:{},since:0,sentA:new Set(),sentR:new Set(),busy:false,again:false,status:'',timer:null,pendingRender:false,lastOk:null,loop:null};
const SYNC_COLS=COLS.filter(c=>c!=='backups');
function h53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(36)+(h1>>>0).toString(36)}
const recHash=r=>h53(JSON.stringify(r));
function setSync(t){SY.status=t;const el=document.getElementById('saveInfo');if(el)el.innerHTML=saveInfo()}
async function api(action,data={}){
  const r=await fetch(gasUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:SY.token,...data})});
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error('Respons server tidak valid — periksa URL Web App dan akses "Siapa saja".')}
  if(j.auth===false&&action!=='login'){SY.token=null;persistSync();toast(j.error||'Sesi berakhir');logout(true)}
  return j}
function persistSync(){if(!IDB.db)return;IDB.put('sync',JSON.stringify({uid:S.uid||S.sid,role:S.role,token:SY.token,exp:SY.exp,base:SY.base,since:SY.since,sentA:[...SY.sentA].slice(-20000),sentR:[...SY.sentR].slice(-20000),url:gasUrl()}))}
async function loadSync(){if(!IDB.db)return null;try{return JSON.parse(await IDB.get('sync')||'null')}catch(e){return null}}
function scheduleSync(){if(!serverMode()||!SY.token)return;clearTimeout(SY.timer);SY.timer=setTimeout(()=>syncNow(),1500)}
function pseudoRecs(){return [['_settings',{id:'settings',data:DB.settings}],['_meta',{id:'meta',data:DB.meta}]]}
function dirtyItems(){const out=[];
  SYNC_COLS.forEach(col=>(DB[col]||[]).forEach(rec=>{const k=col+'|'+rec.id,h=recHash(rec);if(SY.base[k]!==h)out.push({col,rec,k,h})}));
  if(isStaff())pseudoRecs().forEach(([col,rec])=>{const k=col+'|'+rec.id,h=recHash(rec.data);if(SY.base[k]!==h)out.push({col,rec:{...rec,_u:now()},k,h})});
  return out}
function mergeAll(list){const maps={};
  (list||[]).forEach(({col,rec})=>{
    if(col==='_settings'){DB.settings=Object.assign(defaultSettings(),rec.data||{});SY.base['_settings|settings']=recHash(DB.settings);return}
    if(col==='_meta'){DB.meta=Object.assign({},DB.meta,rec.data||{});SY.base['_meta|meta']=recHash(DB.meta);return}
    if(!DB[col])return;
    if(!maps[col]){maps[col]={};DB[col].forEach((r,i)=>maps[col][r.id]=i)}
    const i=maps[col][rec.id];if(i!=null)DB[col][i]=rec;else{maps[col][rec.id]=DB[col].length;DB[col].push(rec)}
    SY.base[col+'|'+rec.id]=recHash(rec)})}
function mergeLog(aud,rev){const A=new Set(DB.audit.map(a=>a.id)),R=new Set(DB.revisions.map(v=>v.id));
  (aud||[]).forEach(a=>{SY.sentA.add(a.id);if(!A.has(a.id))DB.audit.push(a)});(rev||[]).forEach(v=>{SY.sentR.add(v.id);if(!R.has(v.id))DB.revisions.push(v)});
  DB.audit.sort((a,b)=>a.ts<b.ts?-1:1)}
async function syncNow(opt={}){
  if(!serverMode()||!SY.token)return;if(SY.busy){SY.again=true;return}SY.busy=true;setSync('menyinkronkan…');let got=0;
  try{
    const items=dirtyItems();const aud=DB.audit.filter(a=>!SY.sentA.has(a.id)),rev=DB.revisions.filter(v=>!SY.sentR.has(v.id));
    for(let i=0;i<items.length||i===0;i+=200){const ch=items.slice(i,i+200);const pay={records:ch.map(x=>({col:x.col,rec:x.rec}))};
      if(i===0){pay.audit=aud;pay.revisions=rev.map(v=>({...v,data:noPw(clone(v.data))}))}
      if(!ch.length&&!(i===0&&(aud.length||rev.length)))break;
      if(items.length>200)setSync(`mengunggah ${Math.min(i+200,items.length)}/${items.length}…`);
      const r=await api('push',pay);if(!r.ok)throw new Error(r.error||'push gagal');
      ch.forEach(x=>SY.base[x.k]=x.h);if(i===0){aud.forEach(a=>SY.sentA.add(a.id));rev.forEach(v=>SY.sentR.add(v.id))}
      (r.rejected||[]).forEach(x=>{toast('Tidak tersimpan di server ('+x.col+'): '+x.reason);if(x.server)mergeAll([{col:x.col,rec:x.server}])});
      if((r.updated||[]).length){mergeAll(r.updated);got+=r.updated.length}}
    const p=await api('pull',{since:SY.since});if(!p.ok)throw new Error(p.error||'pull gagal');
    mergeAll(p.records);mergeLog(p.audit,p.revisions);got+=(p.records||[]).length;SY.since=p.serverTime;SY.lastOk=new Date();
    setSync('tersinkron '+SY.lastOk.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
    if(got){const bk=DB.backups;DB.backups=[];IDB.put('db',JSON.stringify(DB));DB.backups=bk;if(!opt.silent)softRender()}
    persistSync();
  }catch(e){setSync('offline — perubahan disimpan lokal ('+String(e.message).slice(0,50)+')')}
  finally{SY.busy=false;if(SY.again){SY.again=false;setTimeout(syncNow,400)}}}
const AUTO_RENDER=['dashboard','plomp','progress','fidelity','effect','semester','reports','mreport','indiv','group','portfolio','meetings','collab','mt'];
function softRender(){const modalOpen=document.getElementById('modalBg')?.style.display==='flex';const ae=document.activeElement;const typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if(!modalOpen&&!typing&&AUTO_RENDER.includes(S.page)&&!S.p.take){render()}else{SY.pendingRender=true;setSync(SY.status)}}
async function fullPull(){const p=await api('pull',{since:0});if(!p.ok)throw new Error(p.error);const before=DB;const fresh=blankDB();fresh.backups=before.backups||[];DB=fresh;SY.base={};SY.sentA=new Set(before.audit.filter(a=>SY.sentA.has(a.id)).map(a=>a.id));
  mergeAll(p.records);mergeLog(p.audit,p.revisions);SY.since=p.serverTime;return{before,empty:!all('pck').length}}
function startLoop(){clearInterval(SY.loop);if(serverMode())SY.loop=setInterval(()=>{if(document.visibilityState==='visible')syncNow()},30000)}
window.addEventListener('focus',()=>{if(SY.token)syncNow()});

    if(serverMode()){
      const r=await api('login',{role,ident:id,password:pw});if(!r.ok){msg(r.error);b.disabled=false;b.textContent='Masuk';return}
      SY.token=r.token;SY.exp=r.exp;const prev=await loadSync();
      S.role=role;S.uid=role==='mahasiswa'?null:r.user.id;S.sid=role==='mahasiswa'?r.user.id:null;
      b.textContent='Memuat data…';let init=null;
      if(prev&&prev.uid===r.user.id&&prev.url===gasUrl()&&prev.since&&DB.users.length){SY.base=prev.base||{};SY.since=prev.since;SY.sentA=new Set(prev.sentA||[]);SY.sentR=new Set(prev.sentR||[]);await syncNow({silent:true})}
      else{const f=await fullPull();if(f.empty&&role==='admin')init=f.before}
      S.classId=role==='mahasiswa'?get('students',S.sid)?.classId:null;
      persistSync();startLoop();await flush();afterLogin(init?false:r.mustChange);if(init){SY.mustChangeAfter=r.mustChange;initServerModal(init)}return}
    const acc=findLocalAccount(role,id);
    if(!acc||!checkPw(acc,pw)){msg('ID atau password salah.');b.disabled=false;b.textContent='Masuk';return}
    if(role==='mahasiswa'&&acc.status==='Menunggu verifikasi'){msg('Akun Anda menunggu verifikasi dosen/admin.');b.disabled=false;b.textContent='Masuk';return}
    S.role=role;if(role==='mahasiswa'){S.sid=acc.id;S.uid=null;S.classId=acc.classId}else{S.uid=acc.id;S.sid=null}
    afterLogin(acc.mustChange)
  }catch(e){msg('Tidak dapat terhubung ke server: '+e.message);b.disabled=false;b.textContent='Masuk'}}
function findLocalAccount(role,id){id=id.toLowerCase();if(role==='mahasiswa')return all('students').find(s=>[s.nim,s.email].some(k=>k&&String(k).toLowerCase()===id));return all('users',u=>u.role===role).find(u=>[u.username,u.email].some(k=>k&&String(k).toLowerCase()===id))}
function afterLogin(mustChange){logA('LOGIN','users',S.uid||S.sid,roleName(S.role));save();try{localStorage.setItem('rlgm_sess',JSON.stringify({role:S.role,uid:S.uid,sid:S.sid,local:!serverMode()}))}catch(e){}go('dashboard');if(mustChange)setTimeout(()=>changePwForm(true),300)}
async function logout(force){if(S.role){logA('LOGOUT','users',S.uid||S.sid,'')}if(serverMode()&&SY.token&&!force){setSync('menyimpan ke server…');await syncNow({silent:true})}
  SY.token=null;clearInterval(SY.loop);persistSync();S.role=null;S.uid=null;S.sid=null;try{localStorage.removeItem('rlgm_sess')}catch(e){}await flush();renderLogin()}
function registerForm(){const F=[{k:'nim',l:'NIM',req:true},{k:'nama',l:'Nama lengkap',req:true},{k:'universitas',l:'Nama universitas',t:'selectOther',o:UNIV_OPTS,req:true},{k:'prodi',l:'Program studi',t:'selectOther',o:PRODI_OPTS,req:true},{k:'semester',l:'Semester',t:'number'},{k:'email',l:'Email',t:'email'},{k:'kodeKelas',l:'Kode kelas (dari dosen)',req:true,help:'Contoh: RLGM-5A'},{k:'password',l:'Password (min. 6 karakter)',t:'password',req:true},{k:'password2',l:'Ulangi password',t:'password',req:true}];
  modal('Pendaftaran Mandiri Mahasiswa',`<div class="note">Isi data diri Anda. Kode kelas diberikan oleh dosen pengampu. Setelah mendaftar, masuk dengan <b>NIM</b> dan password yang Anda buat.</div><div class="fg">${F.map(f=>fieldHTML(f,'')).join('')}</div><div id="rgMsg" class="small" style="color:var(--red)"></div>`,
  `<button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="rgBtn" onclick="${on(async()=>{const v=await collect(F);if(!v)return;const m=t=>document.getElementById('rgMsg').textContent=t;
    if(v.password.length<6)return m('Password minimal 6 karakter.');if(v.password!==v.password2)return m('Konfirmasi password tidak sama.');delete v.password2;
    const b=document.getElementById('rgBtn');b.disabled=true;b.textContent='Mengirim…';
    try{let res;if(serverMode())res=await api('register',{data:v});else res=registerLocal(v);
      if(!res.ok){m(res.error);b.disabled=false;b.textContent='Daftar';return}
      closeModal();S._lr='mahasiswa';renderLogin();const box=document.getElementById('lgMsg');box.style.color='var(--teal)';box.textContent=res.message;document.getElementById('lgId').value=v.nim}
    catch(e){m('Gagal terhubung: '+e.message);b.disabled=false;b.textContent='Daftar'}})}">Daftar</button>`,true)}
function registerLocal(d){const reg=DB.settings.reg||{open:true};if(reg.open===false)return{ok:false,error:'Pendaftaran mandiri sedang ditutup.'};
  const k=all('classes').find(c=>(c.code||'').trim().toLowerCase()===d.kodeKelas.trim().toLowerCase());if(!k)return{ok:false,error:'Kode kelas tidak ditemukan. Minta kode kelas kepada dosen.'};
  if(all('students',s=>s.classId===k.id&&String(s.nim).toLowerCase()===d.nim.toLowerCase()).length)return{ok:false,error:'NIM sudah terdaftar di kelas ini.'};
  const n=DB.students.filter(s=>s.classId===k.id).length+1;const pw=d.password;delete d.password;delete d.kodeKelas;
  ins('students',{...d,semester:d.semester||'',classId:k.id,kelas:k.name,kelompok:'',status:reg.approval?'Menunggu verifikasi':'Aktif',anon:'R-'+String(k.code||'X').split('-').pop().replace(/\W/g,'')+'-'+String(n).padStart(3,'0'),consent:'Belum',consentAt:'',selfReg:true,regAt:now(),...pwFields(pw),mustChange:false});
  return{ok:true,message:reg.approval?'Pendaftaran terkirim. Akun aktif setelah diverifikasi dosen/admin.':'Pendaftaran berhasil. Silakan masuk dengan NIM dan password Anda.'}}
function changePwForm(first){const F=[{k:'old',l:'Password saat ini',t:'password',req:true},{k:'nw',l:'Password baru (min. 6 karakter)',t:'password',req:true},{k:'nw2',l:'Ulangi password baru',t:'password',req:true}];
  modal(first?'Ganti password awal':'Ganti password',`${first?'<div class="note w">Akun Anda masih memakai password awal. Demi keamanan data penelitian, ganti sekarang.</div>':''}<div class="fg">${F.map(f=>fieldHTML(f,'')).join('')}</div><div id="cpMsg" class="small" style="color:var(--red)"></div>`,
  `<button class="btn" onclick="closeModal()">${first?'Nanti':'Batal'}</button><button class="btn p" onclick="${on(async()=>{const v=await collect(F);if(!v)return;const m=t=>document.getElementById('cpMsg').textContent=t;if(v.nw.length<6)return m('Minimal 6 karakter.');if(v.nw!==v.nw2)return m('Konfirmasi tidak sama.');
    const col=S.role==='mahasiswa'?'students':'users',id=S.uid||S.sid;
    if(serverMode()){try{const r=await api('changePassword',{old:v.old,nw:v.nw});if(!r.ok)return m(r.error);const rec=get(col,id);if(rec){rec.mustChange=false;SY.base[col+'|'+id]=recHash(rec)}}catch(e){return m('Gagal terhubung: '+e.message)}}
    else{const acc=get(col,id);if(!checkPw(acc,v.old))return m('Password saat ini salah.');upd(col,id,{...pwFields(v.nw),mustChange:false},'Ganti password oleh pemilik akun')}
    logA('PASSWORD',col,id,'Ganti password');save();closeModal();toast('Password berhasil diganti')})}">Simpan</button>`)}
function resetPwForm(col,r){openForm({title:'Reset password — '+(r.nama||r.name),note:'Password baru dikirimkan kepada pemilik akun secara langsung. Pemilik akun diminta menggantinya saat login berikutnya.',fields:[{k:'pw',l:'Password baru (min. 6 karakter)',req:true,def:col==='students'?r.nim:''}],onSave:v=>{if(String(v.pw).length<6&&col!=='students'){toast('Minimal 6 karakter');return}upd(col,r.id,{...pwFields(v.pw),mustChange:true},'Reset password oleh '+roleName(S.role));toast('Password direset');render()}})}
function connForm(){modal('Koneksi database (Google Apps Script)',`<div class="note">Tempel URL Web App Google Apps Script (berakhiran <code>/exec</code>). URL bawaan dapat ditanam di <code>index.html</code> (RLGM_CONFIG.GAS_URL) agar semua perangkat otomatis terhubung. Kosongkan untuk mode lokal.</div>${fieldHTML({k:'gas',l:'URL Web App',full:true},gasUrl())}<div id="cnMsg" class="small"></div>`,
  `<button class="btn" onclick="${on(async()=>{const u=document.getElementById('f_gas').value.trim();const m=document.getElementById('cnMsg');if(!u){m.textContent='Mode lokal';return}m.textContent='Menguji…';try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'ping'})});const j=await r.json();m.style.color=j.ok?'var(--teal)':'var(--red)';m.textContent=j.ok?'Terhubung ✓ ('+j.app+')':'Server menjawab tetapi tidak dikenali'}catch(e){m.style.color='var(--red)';m.textContent='Gagal: '+e.message}})}">Tes koneksi</button>
   <button class="btn p" onclick="${on(()=>{const u=document.getElementById('f_gas').value.trim();try{localStorage.setItem('rlgm_gas',u)}catch(e){}SY.base={};SY.since=0;closeModal();renderLogin();toast(u?'Terhubung ke Google Sheets':'Mode lokal')})}">Simpan</button>`)}
function serverCard(){const sv=serverMode();
  return card('Database terpusat (Google Sheets)',`<div class="note">${sv?`Terhubung ke <code>${esc(gasUrl().slice(0,70))}…</code><br>Status: <b>${esc(SY.status||'-')}</b>${SY.lastOk?' · sinkron terakhir '+fmtDT(SY.lastOk):''}`:'Belum terhubung — aplikasi berjalan dalam mode lokal.'}</div>
  <p class="small">Sinkronisasi berjalan otomatis setiap perubahan (±1,5 detik), setiap 30 detik, dan saat jendela aktif kembali. Bila offline, perubahan tetap tersimpan di perangkat dan dikirim saat koneksi kembali. Setiap perubahan di server mengarsipkan versi lama pada sheet <code>history</code>.</p>`,
  btn('Atur URL',connForm,'','gear')+(sv&&SY.token?btn('Sinkron sekarang',()=>syncNow(),'p','db')+btn('Unduh ulang semua data dari server',()=>confirmBox('Muat ulang seluruh data dari server? Perubahan lokal yang belum terkirim akan dikirim terlebih dahulu.',async()=>{await syncNow({silent:true});await fullPull();await flush();render();toast('Data dimuat ulang')}),'')+(isA()?btn('Unggah seluruh data perangkat ini ke server',()=>confirmBox('Kirim ulang semua record di perangkat ini ke server? Record yang lebih lama dari versi server akan ditolak (dicatat sebagai konflik).',()=>{SY.base={};syncNow()}),'d'):''):''))}

/* ---------------- BOOT ---------------- */
function migrateLocalPasswords(){if(serverMode())return;let n=0;
  all('users').forEach(u=>{if(!u.pwHash){if(!u.username)u.username=(u.email||'').split('@')[0]||u.role;Object.assign(u,pwFields(u.role==='admin'?'admin123':u.role+'123'));u.mustChange=true;n++}});
  all('students').forEach(s=>{if(!s.pwHash){Object.assign(s,pwFields(s.nim));s.mustChange=true;n++}});
  if(n){logA('MIGRASI','users','-',n+' akun diberi password awal');save()}}
(async function boot(){await loadDB();migrateLocalPasswords();
  if(DB.settings.autoBackup){const last=DB.backups[DB.backups.length-1];if(!last||Date.now()-new Date(last.at).getTime()>864e5)snapshot('Backup otomatis harian')}
  let sess=null;try{sess=JSON.parse(localStorage.getItem('rlgm_sess')||'null')}catch(e){}
  const l=(()=>{try{return JSON.parse(localStorage.getItem('rlgm_last')||'null')}catch(e){return null}})();
  if(sess){
    if(serverMode()){const p=await loadSync();if(p&&p.token&&p.exp>Date.now()&&p.uid===(sess.uid||sess.sid)&&p.url===gasUrl()){Object.assign(S,{role:sess.role,uid:sess.uid,sid:sess.sid});SY.token=p.token;SY.exp=p.exp;SY.base=p.base||{};SY.since=p.since||0;SY.sentA=new Set(p.sentA||[]);SY.sentR=new Set(p.sentR||[]);if(S.role==='mahasiswa')S.classId=get('students',S.sid)?.classId;if(l){S.page=l.page;S.p=l.p||{}}startLoop();render();syncNow();}else render()}
    else if(sess.local&&((sess.role==='mahasiswa'&&get('students',sess.sid))||(sess.uid&&get('users',sess.uid)))){Object.assign(S,{role:sess.role,uid:sess.uid,sid:sess.sid});if(S.role==='mahasiswa')S.classId=get('students',S.sid).classId;if(l){S.page=l.page;S.p=l.p||{}}render()}
    else render()}
  else render();
  await flush();
  document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
})();

</script>
